spring.application.name=notification-service
server.port=${PORT:8099}

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sigip_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Seguridad ---
sigip.jwt.secret=${JWT_SECRET}

# --- Mensajería (RabbitMQ): consume los eventos de pedidos publicados por sales-service ---
sigip.eventos.habilitados=${EVENTOS_HABILITADOS:true}
sigip.rabbit.queue=sigip.notificaciones
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${EVENTOS_HABILITADOS:true}
# Reintenta 3 veces; si sigue fallando el mensaje va a la cola de fallos (DLQ) para revisión
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false
management.health.rabbit.enabled=${EVENTOS_HABILITADOS:true}

# --- Descubrimiento y monitoreo ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
